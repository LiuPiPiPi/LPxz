# 管理面板已迁移至 lpxz.work/cms/（同源单容器）。admin.lpxz.work → 301。
server {
    listen 80;
    server_name admin.lpxz.work www.admin.lpxz.work;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name admin.lpxz.work www.admin.lpxz.work;

    ssl_certificate     /etc/letsencrypt/live/admin.lpxz.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.lpxz.work/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 管理面板已迁移至 lpxz.work/cms/（同源单容器）
    location / { return 301 https://lpxz.work/cms$request_uri; }
}
