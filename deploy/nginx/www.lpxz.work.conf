# 前台 + 后台 + API 同源单容器：lpxz.work / www.lpxz.work → 反代到容器 127.0.0.1:8080
# 由仓库版本参考；首次上线手动拷到 /etc/nginx/conf.d/ 后 nginx -t && reload。
server {
    listen 80;
    server_name lpxz.work www.lpxz.work;
    location ^~ /.well-known/acme-challenge/ { root /www/wwwroot/lpxz_view; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name lpxz.work www.lpxz.work;

    ssl_certificate     /etc/letsencrypt/live/lpxz.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lpxz.work/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 10m;

    # 证书续期（webroot），不反代到容器
    location ^~ /.well-known/acme-challenge/ { root /www/wwwroot/lpxz_view; }

    # 其余全部反代到单容器（前台 / 后台 / 公开API / 管理API）
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
