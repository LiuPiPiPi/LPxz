# 公开 API 已迁移至 lpxz.work/api/（同源单容器）。api.lpxz.work → 301。
server {
    listen 80;
    server_name api.lpxz.work;
    location ^~ /.well-known/acme-challenge/ { root /www/wwwroot/lpxz_view; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name api.lpxz.work;

    ssl_certificate     /etc/letsencrypt/live/api.lpxz.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.lpxz.work/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 公开 API 已迁移至 lpxz.work/api/（同源单容器）
    location / { return 301 https://lpxz.work/api$request_uri; }
}
