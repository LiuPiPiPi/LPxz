name: deploy

# 只构建并推送 GHCR 镜像，不再 SSH 连接服务器。
# 服务器通过 deploy/poll-update.sh 以 cron 轮询方式拉取新镜像并重启容器，
# CI 的境外 IP 不再登录云服务器，消除云安全告警。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build amd64 image
        run: |
          docker build \
            -t ghcr.io/liupipipi/lpxz:latest \
            -t ghcr.io/liupipipi/lpxz:sha-${GITHUB_SHA::7} \
            .

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push image
        run: docker push --all-tags ghcr.io/liupipipi/lpxz