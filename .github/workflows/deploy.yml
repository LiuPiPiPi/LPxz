name: deploy

# 构建 amd64 镜像 → docker save 打包成 .tar.gz → scp 直传服务器 → docker load + 重启容器。
# 不走 GHCR pull（ghcr.io→国内拉取极慢），改为单流 bulk 传输，更快更稳。
# deploy 步骤需配好 repo secrets + DEPLOY_ENABLED=true 才会跑；build/save 每次都跑。
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build amd64 image
        run: |
          docker build \
            -t ghcr.io/liupipipi/lpxz:latest \
            -t ghcr.io/liupipipi/lpxz:sha-${GITHUB_SHA::7} \
            .

      - name: Save image to compressed tarball
        run: docker save ghcr.io/liupipipi/lpxz:latest | gzip > lpxz-image.tar.gz

      - name: Show tarball size
        run: ls -lh lpxz-image.tar.gz

      - name: Copy compose + image tarball to server
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "docker-compose.prod.yml,lpxz-image.tar.gz"
          target: /root/lpxz-prod
          overwrite: true
          timeout: 600s

      - name: Load image and restart container
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 10m
          script: |
            docker load < /root/lpxz-prod/lpxz-image.tar.gz
            docker compose -f /root/lpxz-prod/docker-compose.prod.yml up -d
            rm -f /root/lpxz-prod/lpxz-image.tar.gz
            docker image prune -f || true
